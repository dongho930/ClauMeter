<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>클로미터</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #1f2126;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-app-region: drag;
    user-select: none;
    overflow: hidden;
  }
  .panel {
    box-sizing: border-box;
    position: relative;
    width: 100%;
    height: 100%;
    background: #1f2126;
    padding: 10px 12px;
    color: #e6e6e6;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .title { font-size: 12px; font-weight: 600; }
  .header-right { display: flex; align-items: center; gap: 6px; -webkit-app-region: no-drag; }
  .safe-controls { display: flex; align-items: center; gap: 6px; }
  .updated { font-size: 10px; color: #9aa0a6; }
  .info-btn {
    background: transparent;
    border: none;
    color: #9aa0a6;
    font-size: 13px;
    line-height: 1;
    padding: 0;
    cursor: pointer;
  }
  .info-btn:hover { color: #e6e6e6; }
  .info-btn.active { color: #43a047; }
  .info-btn:disabled { opacity: 0.5; cursor: default; }
  .info-btn svg {
    width: 13px;
    height: 13px;
    vertical-align: middle;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .row { margin-bottom: 8px; }
  .row:last-child { margin-bottom: 0; }
  .row-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 3px;
  }
  .row-label { font-size: 10px; color: #9aa0a6; }
  .row-pct { font-size: 12px; font-weight: 700; }
  /* 왼쪽=기준선 안내, 오른쪽=초기화까지 남은 시간. 기준선 안내가 비어도 남은 시간은 오른쪽에 고정된다. */
  .reset-info {
    margin-top: 4px;
    font-size: 10px;
    color: #9aa0a6;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .pace-info { white-space: nowrap; }
  .track {
    position: relative;
    width: 100%;
    height: 14px;
    background: #33363c;
    border-radius: 7px;
    overflow: hidden;
  }
  /* 남은 시간 대비 적정 사용률 위치. 채움(.fill)보다 뒤에 와서 그 위에 겹쳐 그려진다.
     어두운 빈 트랙과 초록/노랑/빨강 채움 위 모두에서 보여야 해서 흰 선 + 어두운 테두리로 둔다. */
  .pace-tick {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 2px;
    margin-left: -1px;
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
    transition: left 0.4s ease;
  }
  .fill {
    height: 100%;
    width: 0%;
    border-radius: 7px;
    transition: width 0.4s ease, background-color 0.4s ease;
    background: #43a047;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="header">
      <span class="title" id="titleText">Claude 사용량</span>
      <div class="header-right" id="headerRight">
        <div class="safe-controls" id="safeControls">
          <button class="info-btn" id="clickThroughBtn"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8-2"/></svg></button>
        </div>
        <button class="info-btn" id="settingsBtn">⚙</button>
        <button class="info-btn" id="infoBtn">ⓘ</button>
        <button class="info-btn" id="closeBtn">✕</button>
        <span class="updated" id="updated"></span>
      </div>
    </div>
    <div class="row">
      <div class="row-top">
        <span class="row-label" id="fiveHourLabel">5시간</span>
        <span class="row-pct" id="fiveHourPct">0%</span>
      </div>
      <div class="track">
        <div class="fill" id="fiveHourFill"></div>
        <div class="pace-tick" id="fiveHourPaceTick" hidden></div>
      </div>
      <div class="reset-info">
        <span class="pace-info" id="fiveHourPaceInfo"></span>
        <span id="fiveHourResetInfo"></span>
      </div>
    </div>
    <div class="row">
      <div class="row-top">
        <span class="row-label" id="thisWeekLabel">이번 주</span>
        <span class="row-pct" id="weeklyPct">0%</span>
      </div>
      <div class="track">
        <div class="fill" id="weeklyFill"></div>
        <div class="pace-tick" id="weeklyPaceTick" hidden></div>
      </div>
      <div class="reset-info">
        <span class="pace-info" id="weeklyPaceInfo"></span>
        <span id="weeklyResetInfo"></span>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
