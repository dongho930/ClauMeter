<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>사용량 세부 정보</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #1f2126;
    color: #e6e6e6;
    margin: 0;
    padding: 18px;
  }
  h3 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
  .stats { display: flex; gap: 10px; margin-bottom: 14px; }
  .stat-card {
    flex: 1;
    background: #2a2d33;
    border: 1px solid #3a3d44;
    border-radius: 6px;
    padding: 10px;
  }
  /* 한도 이름은 이 창의 뼈대다. 11px 흐린 회색이면 본문에 묻혀서 어느 카드가 어느 한도인지
     매번 다시 읽어야 했다. 크기·굵기·명도를 같이 올리고, 앞에 상태 점을 둔다. */
  .limit-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: #e6e6e6;
    margin-bottom: 6px;
  }
  .limit-dot {
    flex-shrink: 0;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4a4e55;
  }
  /* 같은 한도의 통계 카드와 조언 카드를 왼쪽 상태색 바로 묶는다. 없으면 카드 네 개가 따로 논다. */
  .limit-card { border-left: 3px solid #4a4e55; }
  .stat-row { font-size: 12px; margin-bottom: 3px; }
  .stat-row b { color: #e6e6e6; }
  .model-tag { font-size: 10px; color: #7a828a; }
  .stat-row.accuracy { font-size: 10px; color: #7a828a; margin-top: 4px; }
  .status { font-size: 11px; color: #9aa0a6; margin-bottom: 8px; min-height: 14px; }
  .advice-box {
    background: #2a2d33;
    border: 1px solid #3a3d44;
    border-radius: 6px;
    padding: 12px;
    font-size: 13px;
    line-height: 1.6;
    min-height: 140px;
    white-space: pre-wrap;
  }
  .advice-box.error { color: #ff6b6b; }
  .advice-summary {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #2a2d33;
    border: 1px solid #3a3d44;
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .risk-badge {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 600;
    color: #1f2126;
    padding: 3px 8px;
    border-radius: 10px;
  }
  .advice-cards { display: flex; flex-direction: column; gap: 8px; }
  .advice-card {
    background: #2a2d33;
    border: 1px solid #3a3d44;
    border-radius: 6px;
    padding: 10px 12px;
  }
  /* 헤드라인은 "이 속도면 ○○ 뒤 한도 도달" - 한도에 닿는 경우에만 경고색이 된다. */
  .advice-card-headline { font-size: 17px; font-weight: 700; color: #7cc4ff; }
  .advice-card-headline.hits-limit { color: #ff8a65; }
  .advice-card-headline.unknown { font-size: 13px; font-weight: 400; color: #7a828a; }
  .advice-card-sub { font-size: 11px; color: #9aa0a6; margin-top: 2px; }
  /* 다른 한도와의 연결(5시간 <-> 주간 환산). 표본이 부족하면 통째로 비어서 자리를 차지하지 않는다. */
  .advice-card-link { font-size: 11px; color: #7cc4ff; margin-top: 4px; }
  .advice-card-link:empty { display: none; }
  .advice-card-body { font-size: 13px; line-height: 1.5; margin-top: 6px; }
  .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  button {
    padding: 7px 16px;
    font-size: 12px;
    border-radius: 4px;
    border: 1px solid #3a3d44;
    background: #2a2d33;
    color: #e6e6e6;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <h3 id="detailHeading">AI 사용량 페이스 조언</h3>
  <div class="stats" id="stats"></div>
  <div class="status" id="status"></div>
  <div class="advice-summary" id="adviceSummary" style="display:none;">
    <span class="risk-badge" id="riskBadge"></span>
    <span id="summaryText"></span>
  </div>
  <div class="advice-cards" id="adviceCards" style="display:none;">
    <div class="advice-card limit-card" id="fiveHourAdviceCard">
      <div class="limit-title">
        <span class="limit-dot" id="fiveHourAdviceDot"></span>
        <span id="fiveHourCardTitle">5시간 한도</span>
      </div>
      <div class="advice-card-headline" id="fiveHourHeadline"></div>
      <div class="advice-card-sub" id="fiveHourSub"></div>
      <div class="advice-card-link" id="fiveHourLink"></div>
      <div class="advice-card-body" id="fiveHourAdvice"></div>
    </div>
    <div class="advice-card limit-card" id="weeklyAdviceCard">
      <div class="limit-title">
        <span class="limit-dot" id="weeklyAdviceDot"></span>
        <span id="weeklyCardTitle">주간 한도</span>
      </div>
      <div class="advice-card-headline" id="weeklyHeadline"></div>
      <div class="advice-card-sub" id="weeklySub"></div>
      <div class="advice-card-link" id="weeklyLink"></div>
      <div class="advice-card-body" id="weeklyAdvice"></div>
    </div>
  </div>
  <div class="advice-box" id="adviceBox" style="display:none;"></div>
  <div class="buttons">
    <button id="refreshBtn"></button>
  </div>
  <script src="detail.js"></script>
</body>
</html>
